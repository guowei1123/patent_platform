name: Build and Publish Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME || github.repository }}
  NODE_ENV: production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract package name for cleanup
        if: env.REGISTRY == 'ghcr.io'
        id: pkg
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | awk -F/ '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Delete older images
        if: env.REGISTRY == 'ghcr.io'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: "container"
          min-versions-to-keep: 3
          delete-only-untagged-versions: "false"
